name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs-web
        uses: actions/checkout@v4

      # GITHUB_TOKEN cannot read other private org repos; checkout returns 404 without a PAT.
      - name: Require CONTRACTS_REPO_TOKEN for private contracts
        env:
          CONTRACTS_REPO_TOKEN: ${{ secrets.CONTRACTS_REPO_TOKEN }}
        run: |
          if [ -z "${CONTRACTS_REPO_TOKEN}" ]; then
            echo "::error::Set repository secret CONTRACTS_REPO_TOKEN (fine-grained PAT: Contents read on peoplespaceam/contracts; or classic PAT with repo scope). docs-web CI clones contracts to run sync-specs."
            exit 1
          fi

      - name: Checkout contracts
        uses: actions/checkout@v4
        with:
          repository: peoplespaceam/contracts
          token: ${{ secrets.CONTRACTS_REPO_TOKEN }}
          path: contracts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CONTRACTS_ROOT: contracts
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-web-dist
          path: dist
          if-no-files-found: error
