openapi: 3.0.3
info:
  title: PeopleSpaceAM Telegram Mini App API
  version: 1.0.0
  description: |
    Canonical HTTP contract for Telegram Mini App business endpoints owned by
    `platform-api`.

    These routes are intended to run behind AccessGate proxy. Browser clients
    authenticate through AccessGate; `platform-api` receives trusted identity
    context from the proxy and uses `channelUserId` to load the linked Telegram
    identity.
servers:
  - url: https://{publicHost}
    description: Public PeopleSpaceAM edge host
    variables:
      publicHost:
        default: example.peoplespace.am
tags:
  - name: MiniApp
    description: Telegram Mini App request form and submission workflow.
paths:
  /miniapp/request-form-definition:
    get:
      tags:
        - MiniApp
      operationId: getMiniAppRequestFormDefinition
      summary: Get request form definition
      description: Returns schema-driven metadata for rendering a Telegram Mini App request form.
      parameters:
        - $ref: "#/components/parameters/RequestTypeId"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/ChannelUserId"
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          description: Form definition loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppRequestFormDefinitionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/RequestTypeNotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /miniapp/request-form-options:
    get:
      tags:
        - MiniApp
      operationId: getMiniAppRequestFormOptions
      summary: Resolve dynamic form options
      description: Returns option collections needed by the selected request form.
      parameters:
        - $ref: "#/components/parameters/RequestTypeId"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/ChannelUserId"
        - $ref: "#/components/parameters/Channel"
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Selected start date, when the option source depends on date range.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Selected end date, when the option source depends on date range.
        - name: startTime
          in: query
          required: false
          schema:
            type: string
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Selected local start time in HH:mm form.
        - name: endTime
          in: query
          required: false
          schema:
            type: string
            pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Selected local end time in HH:mm form.
      responses:
        "200":
          description: Form options loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppRequestFormOptionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UserTokenUnavailable"
        "404":
          $ref: "#/components/responses/RequestTypeNotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /miniapp/requests:
    post:
      tags:
        - MiniApp
      operationId: submitMiniAppRequest
      summary: Submit a request
      description: Validates and submits the selected request type to PeopleSpace as the linked user.
      parameters:
        - $ref: "#/components/parameters/ChannelUserIdOptional"
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniAppSubmitRequest"
      responses:
        "200":
          description: Request submitted or validation result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UserTokenUnavailable"
        "404":
          $ref: "#/components/responses/RequestTypeNotFound"
        "422":
          description: Server-side validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppSubmitResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /miniapp/requests/draft:
    post:
      tags:
        - MiniApp
      operationId: saveMiniAppRequestDraft
      summary: Save a request draft
      description: Validates and saves an in-progress request draft as the linked user.
      parameters:
        - $ref: "#/components/parameters/ChannelUserIdOptional"
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MiniAppSaveDraftRequest"
      responses:
        "200":
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppSaveDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UserTokenUnavailable"
        "404":
          $ref: "#/components/responses/RequestTypeNotFound"
        "422":
          description: Server-side validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppSubmitResponse"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    RequestTypeId:
      name: requestTypeId
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: PeopleSpace vacation request type identifier selected by the bot or mini app.
    CompanyId:
      name: companyId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Optional PeopleSpace company identifier used when a linked user has multiple companies.
    ChannelUserId:
      name: channelUserId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Telegram user identifier for the linked identity.
    ChannelUserIdOptional:
      name: channelUserId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Telegram user identifier. If omitted on POST requests, `clientContext.telegramUser` is used.
    Channel:
      name: channel
      in: query
      required: false
      schema:
        type: string
        default: telegram
        enum:
          - telegram
          - slack
      description: Identity channel. Defaults to `telegram`.
  responses:
    BadRequest:
      description: Invalid query string or JSON payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UserTokenUnavailable:
      description: Linked user token is unavailable; the user must relink or refresh auth.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTypeNotFound:
      description: Request type is unavailable for the linked user or not mapped by the mini app API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: Request type is known but submit or draft behavior is not implemented yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: PeopleSpace upstream failed or returned an unexpected response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Mini app dependencies are not configured or an upstream dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    MiniAppRequestFormDefinitionResponse:
      type: object
      required:
        - requestType
        - template
        - fields
        - actions
      properties:
        requestType:
          $ref: "#/components/schemas/MiniAppRequestTypeMeta"
        template:
          $ref: "#/components/schemas/MiniAppTemplateSpec"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppFieldSpec"
        defaults:
          type: object
          additionalProperties: true
        optionSources:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppOptionSourceRef"
        actions:
          $ref: "#/components/schemas/MiniAppActionSpec"
    MiniAppRequestFormOptionsResponse:
      type: object
      properties:
        managers:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppOptionItem"
        businessTripLocations:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppOptionItem"
        companyUnits:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppOptionItem"
        employees:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppEmployeeOptionItem"
    MiniAppSubmitRequest:
      type: object
      required:
        - requestTypeId
        - payload
      properties:
        requestTypeId:
          type: integer
          format: int64
          minimum: 1
        companyId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        payload:
          type: object
          additionalProperties: true
        files:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppFileRef"
        clientContext:
          $ref: "#/components/schemas/MiniAppClientMeta"
    MiniAppSaveDraftRequest:
      allOf:
        - $ref: "#/components/schemas/MiniAppSubmitRequest"
    MiniAppSubmitResponse:
      type: object
      required:
        - requestId
        - status
      properties:
        requestId:
          type: integer
          format: int64
        status:
          type: string
          example: submitted
        message:
          type: string
        redirect:
          $ref: "#/components/schemas/MiniAppRedirect"
        validationErrors:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppFieldErr"
    MiniAppSaveDraftResponse:
      type: object
      required:
        - draftId
        - status
      properties:
        draftId:
          type: integer
          format: int64
        status:
          type: string
          example: draft_saved
        message:
          type: string
        revision:
          type: integer
          format: int64
    MiniAppRequestTypeMeta:
      type: object
      required:
        - id
        - enum
        - groupId
        - groupKey
        - title
        - constraints
      properties:
        id:
          type: integer
          format: int64
        enum:
          type: string
        groupId:
          type: integer
          format: int64
        groupKey:
          type: string
        title:
          type: string
        localizedNames:
          type: object
          additionalProperties:
            type: string
        iconUrl:
          type: string
        timeCalculationType:
          type: string
        constraints:
          $ref: "#/components/schemas/MiniAppRequestConstraint"
    MiniAppRequestConstraint:
      type: object
      properties:
        onlySameDay:
          type: boolean
        perRequestMaxCount:
          type: number
          format: double
        duration:
          $ref: "#/components/schemas/MiniAppDurationRule"
        pastSubmission:
          $ref: "#/components/schemas/MiniAppSubmissionWindow"
        futureSubmission:
          $ref: "#/components/schemas/MiniAppSubmissionWindow"
        balanceGuard:
          $ref: "#/components/schemas/MiniAppBalanceGuardRule"
    MiniAppDurationRule:
      type: object
      required:
        - value
        - unit
      properties:
        value:
          type: number
          format: double
        unit:
          type: string
    MiniAppSubmissionWindow:
      type: object
      required:
        - value
        - unit
      properties:
        value:
          type: integer
          format: int64
        unit:
          type: string
    MiniAppBalanceGuardRule:
      type: object
      required:
        - fieldKey
        - enabled
      properties:
        fieldKey:
          type: string
        enabled:
          type: boolean
    MiniAppTemplateSpec:
      type: object
      required:
        - key
      properties:
        key:
          type: string
        title:
          type: string
        fieldOrder:
          type: array
          items:
            type: string
        behaviorIds:
          type: array
          items:
            type: string
    MiniAppFieldSpec:
      type: object
      required:
        - key
        - type
      properties:
        key:
          type: string
        type:
          type: string
        label:
          type: string
        required:
          type: boolean
        visible:
          type: boolean
        disabled:
          type: boolean
        placeholder:
          type: string
        helperText:
          type: string
        maxLength:
          type: integer
          format: int64
        multiple:
          type: boolean
        acceptsFiles:
          type: boolean
        optionSource:
          $ref: "#/components/schemas/MiniAppOptionSourceRef"
        validation:
          type: array
          items:
            $ref: "#/components/schemas/MiniAppValidationRef"
        uiHints:
          type: object
          additionalProperties: true
    MiniAppOptionSourceRef:
      type: object
      required:
        - key
        - kind
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
            - remote
            - inline
        endpoint:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
    MiniAppValidationRef:
      type: object
      required:
        - rule
      properties:
        rule:
          type: string
        config:
          type: object
          additionalProperties: true
    MiniAppActionSpec:
      type: object
      required:
        - canSaveDraft
        - canSubmit
      properties:
        canSaveDraft:
          type: boolean
        canSubmit:
          type: boolean
    MiniAppOptionItem:
      type: object
      required:
        - value
        - label
      properties:
        value:
          description: Option value. Type depends on the backing PeopleSpace option source.
        label:
          type: string
        disabled:
          type: boolean
        meta:
          type: object
          additionalProperties: true
    MiniAppEmployeeOptionItem:
      allOf:
        - $ref: "#/components/schemas/MiniAppOptionItem"
        - type: object
          required:
            - isAvailable
          properties:
            isAvailable:
              type: boolean
    MiniAppFileRef:
      type: object
      required:
        - name
      properties:
        id:
          type: string
        name:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
    MiniAppClientMeta:
      type: object
      properties:
        platform:
          type: string
        telegramUser:
          type: string
        webAppVersion:
          type: string
        requestId:
          type: string
    MiniAppRedirect:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        target:
          type: string
    MiniAppFieldErr:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
