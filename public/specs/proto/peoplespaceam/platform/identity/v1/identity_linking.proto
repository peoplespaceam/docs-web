syntax = "proto3";

package peoplespaceam.platform.identity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/peoplespaceam/contracts/gen/go/peoplespaceam/platform/identity/v1;identityv1";

// Channels: "telegram", "slack", etc.
enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_TELEGRAM = 1;
  CHANNEL_SLACK = 2;
}

message UserIdentity {
  Channel channel = 1;
  string channel_user_id = 2; // tg user id, slack user id, etc.
}

message GetLinkStatusRequest {
  UserIdentity identity = 1;
}

message GetLinkStatusResponse {
  bool linked = 1;
  // filled when linked=true:
  string first_name = 2; // picked from localized_names using preferred_language
  string last_name = 3;
  string preferred_language = 4; // "en-US" | "ru-RU" | "hy-AM"
  string associate_id = 5; // HR associate id
  google.protobuf.Timestamp linked_at = 6;
}

message RequestBusinessEmailOtpRequest {
  UserIdentity identity = 1;
  string business_email = 2;
  string preferred_language = 3; // "en-US" | "ru-RU" | "hy-AM"
}

message RequestBusinessEmailOtpResponse {
  string challenge_id = 1;
  string masked_email = 2;
  google.protobuf.Timestamp expires_at = 3;
  int32 resend_after_seconds = 4;
}

message VerifyBusinessEmailOtpRequest {
  UserIdentity identity = 1;
  string challenge_id = 2;
  string otp_code = 3;
}

message VerifyBusinessEmailOtpResponse {
  bool linked = 1;
  string first_name = 2;
  string last_name = 3;
  string preferred_language = 4;
  string associate_id = 5;
  google.protobuf.Timestamp linked_at = 6;
}

// Unlink drops the identity row so the user can re-link.
message UnlinkRequest {
  UserIdentity identity = 1;
}

message UnlinkResponse {
  bool unlinked = 1;
}

service IdentityLinkingService {
  rpc GetLinkStatus(GetLinkStatusRequest) returns (GetLinkStatusResponse);
  rpc RequestBusinessEmailOtp(RequestBusinessEmailOtpRequest) returns (RequestBusinessEmailOtpResponse);
  rpc VerifyBusinessEmailOtp(VerifyBusinessEmailOtpRequest) returns (VerifyBusinessEmailOtpResponse);
  rpc Unlink(UnlinkRequest) returns (UnlinkResponse);
}
